
name: OW'Beloty - Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Tests et compilation APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Récupérer le projet
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Installer Bun
        uses: oven-sh/setup-bun@v2

      - name: Installer Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Installer Android SDK
        uses: android-actions/setup-android@v3

      - name: Installer les dépendances
        run: bun install --frozen-lockfile

      - name: Installer Android 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Tester le projet
        run: bun run test

      - name: Vérifier TypeScript
        run: bun run lint

      - name: Compiler le projet
        run: bun run build

      - name: Synchroniser Capacitor
        run: bunx cap sync android

      - name: Générer l'APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: OW-Beloty-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
