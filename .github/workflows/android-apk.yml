
name: OW'Beloty - Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Tests et compilation APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Récupérer le projet
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Installer Bun
        uses: oven-sh/setup-bun@v2

      - name: Installer Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Repérer et installer Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager 2>/dev/null | head -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager introuvable dans $ANDROID_HOME/cmdline-tools"
            find "$ANDROID_HOME" -maxdepth 4 -type f -name sdkmanager 2>/dev/null || true
            exit 1
          fi
          echo "SDKMANAGER=$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses
          "$SDKMANAGER" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Installer les dépendances
        run: bun install

      - name: Tester le projet
        run: bun run test

      - name: Vérifier TypeScript
        run: bun run lint

      - name: Compiler le projet
        run: bun run build

      - name: Synchroniser Capacitor
        run: bunx cap sync android

      - name: Préparer la signature persistante
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || [ -z "$ANDROID_KEY_ALIAS" ] || [ -z "$ANDROID_KEY_PASSWORD" ]; then
            echo "::error::Configurez les 4 secrets ANDROID_* dans Settings > Secrets and variables > Actions."
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/owbeloty-upload.jks
          test -s android/app/owbeloty-upload.jks
          cat > android/keystore.properties <<EOF
          storeFile=owbeloty-upload.jks
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF

      - name: Vérifier la présence de la clé persistante
        run: |
          if [ ! -f android/keystore.properties ] || [ ! -f android/app/owbeloty-upload.jks ]; then
            echo "::error::La clé permanente n'est pas configurée. Ajoutez les 4 secrets ANDROID_* dans Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Vérifier le coffre et la clé de signature
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          keytool -list -keystore android/app/owbeloty-upload.jks -storepass "$ANDROID_KEYSTORE_PASSWORD" >/dev/null
          echo "Coffre de signature valide."
          keytool -exportcert -alias "$ANDROID_KEY_ALIAS" -keystore android/app/owbeloty-upload.jks -storepass "$ANDROID_KEYSTORE_PASSWORD" -keypass "$ANDROID_KEY_PASSWORD" -file /tmp/owbeloty-cert.der >/dev/null
          echo "Clé privée et alias valides."
          openssl dgst -sha256 /tmp/owbeloty-cert.der

      - name: Générer l'APK signé
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: OW-Beloty-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
